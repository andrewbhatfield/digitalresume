{% load static %}
<html lang="en" data-bs-theme="dark">
  <head>
    <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    }; 
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0"/>
    <link rel="stylesheet" type="text/css" href="https://jsxgraph.uni-bayreuth.de/distrib/jsxgraph.css"/>
    <script type="text/javascript" src="https://jsxgraph.uni-bayreuth.de/distrib/jsxgraphcore.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
    .material-symbols-outlined {
      vertical-align: sub;
    }
    @media all and (min-width: 992px) {
      .navbar .nav-item .dropdown-menu{ display: none; }
      .navbar .nav-item:hover .nav-link{   }
      .navbar .nav-item:hover .dropdown-menu{ display: block; }
      .navbar .nav-item .dropdown-menu{ margin-top:0; }
    }	
    .navbar-text {
        position: absolute;
        width: 100%;
        left: 0;
        text-align: center;
        margin: auto;
        font-size:large;
        color:white !important;
        padding: .3rem 1rem;
    }
    .nav-link, .navbar-brand {
      padding: .3rem 1rem;
    }
    .nav-item, .navbar-brand {
      z-index:2;
    }
    .navbar {
      border-bottom:1px solid;
    }
    .ms-auto .nav-link{
      margin-right:10px;
    }
    .icon{
      height:1.8rem;
      width:1.8rem;
    }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="{% url 'home' %}">andrew hatfield</a>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto">
          <p class="navbar-text">{% block title %}{% endblock title %}</p>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">projects</a>
            <div class="dropdown-menu" aria-labelledby="navbarDropdown">
              <a class="dropdown-item" href="{% url 'ecc' %}">cryptography</a>
              <a class="dropdown-item" href="{% url 'minimax' %}">minimax</a>
              <a class="dropdown-item" href="{% url 'mazes' %}">mazes</a>
            </div>
          </li>
          <li class="nav-item"><a class="nav-link" href="{% url 'writeups' %}" role="button">writeups</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}" role="button">contact</a></li>
          {% block links %}
          {% endblock links %}
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <div class="icon-wrapper">
              <a class="nav-link" href="https://github.com/andrewbhatfield/digitalresume" role="button"><img class='icon' src='{% static "github-mark-white.png" %}'></a>
            </div>
          </li>
      </ul>
      </div>
    </nav>

    {% block content %}
    {% endblock content %}
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>

  </body>
</html>
